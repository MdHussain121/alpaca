<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 640" width="1020" height="640" role="img" aria-label="alpaca launcher terminal UI">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="bannerGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 13px; line-height: 1.4; }
    .title-left { fill: #cdd6f4; font-weight: 700; font-size: 13px; }
    .badge-cuda { fill: #a6e3a1; font-weight: 700; font-size: 12px; }
    .border { fill: #45475a; }
    .panel-title { fill: #cba6f7; font-weight: 700; font-size: 13px; }
    .panel-title-dim { fill: #6c7086; font-weight: 600; font-size: 13px; }
    .txt-text { fill: #cdd6f4; }
    .txt-muted { fill: #6c7086; }
    .txt-accent { fill: #cba6f7; font-weight: 600; }
    .txt-cyan { fill: #94e2d5; }
    .txt-green { fill: #a6e3a1; font-weight: 600; }
    .txt-yellow { fill: #f9e2af; font-weight: 600; }
    .txt-blue { fill: #89b4fa; }
    .txt-gold { fill: #fab387; font-weight: 700; }
    .gauge-fill { fill: #a6e3a1; }
    .gauge-empty { fill: #313244; }
  </style>

  <!-- Terminal Window Chrome -->
  <rect x="20" y="16" width="980" height="606" rx="14" fill="#1e1e2e" stroke="#313244" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Title bar -->
  <path d="M 20 30 Q 20 16 34 16 L 986 16 Q 1000 16 1000 30 L 1000 48 L 20 48 Z" fill="#181825"/>
  <line x1="20" y1="48" x2="1000" y2="48" stroke="#313244" stroke-width="1"/>

  <!-- Traffic light buttons -->
  <circle cx="42" cy="32" r="6" fill="#f38ba8"/>
  <circle cx="62" cy="32" r="6" fill="#f9e2af"/>
  <circle cx="82" cy="32" r="6" fill="#a6e3a1"/>

  <!-- Window title -->
  <text class="mono title-left" x="110" y="36">alpaca  ·  portable model launcher</text>
  <text class="mono badge-cuda" x="976" y="36" text-anchor="end">● CUDA · RTX 4060 Laptop GPU 8.0 GB</text>

  <!-- Terminal Body Content -->
  <g transform="translate(36, 60)">

    <!-- ASCII Brand Banner -->
    <text class="mono" font-size="12" font-weight="700">
      <tspan x="10" y="14" fill="#cba6f7">  ╭─╮╭─╮    ▄▀█ █   █▀█ ▄▀█ █▀▀ ▄▀█</tspan>
      <tspan x="10" y="28" fill="#89b4fa">  │ •  ╰─╮  █▀█ █▄▄ █▀▀ █▀█ █▄▄ █▀█</tspan>
      <tspan x="10" y="42" fill="#6c7086">  │ ═══╭─╯  portable launcher · llama.cpp</tspan>
    </text>

    <!-- TOP SECTION: Models (Left) and Settings (Right) -->

    <!-- Models Panel (Focused) -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="370" height="280" rx="8" fill="#181825" stroke="#cba6f7" stroke-width="1.5"/>
      <text class="mono panel-title" x="16" y="22">Models</text>
      <text class="mono txt-muted" x="354" y="22" text-anchor="end">4 model(s)</text>

      <!-- Model 1 (Active Cursor) -->
      <g transform="translate(16, 42)">
        <text class="mono txt-accent" font-weight="700" x="0" y="0">▸ Qwen3.5-4B-3D-Coder-Q4_K_M</text>
        <text class="mono txt-muted" font-size="11" x="14" y="15">Q4_K_M · 4.0B · 36L · qwen3 · <tspan class="txt-gold">Gold ★★★</tspan></text>
      </g>

      <!-- Model 2 -->
      <g transform="translate(16, 82)">
        <text class="mono txt-text" x="0" y="0">  Spark-X2.6-4B-abliterated-Q4_K_M</text>
        <text class="mono txt-muted" font-size="11" x="14" y="15">Q4_K_M · 4.0B · 36L · llama · Silver ★★</text>
      </g>

      <!-- Model 3 -->
      <g transform="translate(16, 122)">
        <text class="mono txt-text" x="0" y="0">  LFM2.5-8B-A1B-Q4_0</text>
        <text class="mono txt-muted" font-size="11" x="14" y="15">Q4_0 · 8.0B · 36L · lfm · Bronze ★</text>
      </g>

      <!-- Model 4 -->
      <g transform="translate(16, 162)">
        <text class="mono txt-text" x="0" y="0">  Tiel-Coder-35B-A3B-UD-IQ4_XS</text>
        <text class="mono txt-muted" font-size="11" x="14" y="15">IQ4_XS · 35.0B · 64L · MoE · <tspan class="txt-gold">Gold ★★★</tspan></text>
      </g>

      <text class="mono txt-muted" font-size="11" x="16" y="260">↑↓ select · enter launch · / filter</text>
    </g>

    <!-- Settings Panel (Right) -->
    <g transform="translate(382, 52)">
      <rect x="0" y="0" width="566" height="280" rx="8" fill="#181825" stroke="#313244" stroke-width="1.5"/>
      <text class="mono panel-title-dim" x="16" y="22">Settings</text>
      <text class="mono txt-muted" x="550" y="22" text-anchor="end">tab to focus</text>

      <!-- Setting Rows -->
      <g transform="translate(16, 40)" class="mono">
        <!-- Context Slider -->
        <text x="0" y="0" class="txt-text">  Context         </text>
        <text x="140" y="0" class="txt-accent">━━━●──────</text>
        <text x="240" y="0" class="txt-accent" font-weight="700">32K</text>
        <text x="320" y="0" class="txt-muted">(KV: 512 MiB)</text>

        <!-- K Cache -->
        <text x="0" y="20" class="txt-text">  K cache         </text>
        <text x="140" y="20" class="txt-text">q8_0</text>
        <text x="240" y="20" class="txt-muted">auto: q8_0/q8_0 (7.1G free)</text>

        <!-- V Cache -->
        <text x="0" y="40" class="txt-text">  V cache         </text>
        <text x="140" y="40" class="txt-text">q8_0</text>
        <text x="240" y="40" class="txt-cyan">forces flash attn</text>

        <!-- Flash Attention -->
        <text x="0" y="60" class="txt-text">  Flash attn      </text>
        <text x="140" y="60" class="txt-green">ON</text>
        <text x="240" y="60" class="txt-muted">(required for context &gt;8K)</text>

        <!-- GPU Layers Slider -->
        <text x="0" y="80" class="txt-text">  GPU layers      </text>
        <text x="140" y="80" class="txt-accent">━━━━━━━━━●</text>
        <text x="240" y="80" class="txt-green" font-weight="700">all (36)</text>
        <text x="320" y="80" class="txt-muted">100% offload</text>

        <!-- KV Offload -->
        <text x="0" y="100" class="txt-text">  KV offload      </text>
        <text x="140" y="100" class="txt-green">on</text>
        <text x="240" y="100" class="txt-muted">KV stored in VRAM</text>

        <!-- Auto fit -->
        <text x="0" y="120" class="txt-text">  Auto fit        </text>
        <text x="140" y="120" class="txt-green">on</text>
        <text x="240" y="120" class="txt-muted">calculates optimal context</text>

        <!-- Auto KV -->
        <text x="0" y="140" class="txt-text">  Auto KV         </text>
        <text x="140" y="140" class="txt-text">on (q8_0/q8_0)</text>
        <text x="240" y="140" class="txt-muted">balanced speed &amp; quality</text>

        <!-- Load mode -->
        <text x="0" y="160" class="txt-text">  Load mode       </text>
        <text x="140" y="160" class="txt-cyan">auto (none)</text>
        <text x="240" y="160" class="txt-muted">safe GPU fit, direct alloc</text>

        <!-- Warmup -->
        <text x="0" y="180" class="txt-text">  Warmup          </text>
        <text x="140" y="180" class="txt-green">on</text>
        <text x="240" y="180" class="txt-muted">prewarms CUDA kernels</text>

        <!-- Threads Slider -->
        <text x="0" y="200" class="txt-text">  Threads         </text>
        <text x="140" y="200" class="txt-accent">●─────────</text>
        <text x="240" y="200" class="txt-text">auto (10)</text>
        <text x="320" y="200" class="txt-muted">optimal core affinity</text>
      </g>

      <line x1="16" y1="248" x2="550" y2="248" stroke="#313244" stroke-width="1"/>
      <text class="mono txt-muted" font-size="11" x="16" y="266">tab panels · ←→ slide · enter edit · t theme · 1/34</text>
    </g>

    <!-- MIDDLE SECTION: Memory Panel -->
    <g transform="translate(0, 342)">
      <rect x="0" y="0" width="948" height="84" rx="8" fill="#181825" stroke="#313244" stroke-width="1.5"/>
      <text class="mono panel-title-dim" x="16" y="20">Memory</text>

      <!-- VRAM and RAM gauges -->
      <g transform="translate(16, 42)" class="mono">
        <text x="0" y="0" class="txt-muted">VRAM </text>
        <text x="46" y="0" class="txt-green">█████████████████████▎</text><text x="230" y="0" class="gauge-empty">░░░░░░░░</text>
        <text x="306" y="0" class="txt-text" font-weight="700">2.9/8.0 GB</text>

        <text x="440" y="0" class="txt-muted">RAM </text>
        <text x="480" y="0" class="txt-blue">████████</text><text x="550" y="0" class="gauge-empty">░░░░░░░░░░░░░░░░░░░░</text>
        <text x="730" y="0" class="txt-text" font-weight="700">4.1/15.7 GB</text>
      </g>

      <text class="mono txt-muted" font-size="11" x="16" y="68">  weights 2.4G GPU · KV 0.5G GPU · comp 0.4G GPU · compute buffer estimated</text>
    </g>

    <!-- BOTTOM SECTION: Command Box -->
    <g transform="translate(0, 436)">
      <rect x="0" y="0" width="948" height="66" rx="8" fill="#181825" stroke="#313244" stroke-width="1.5"/>
      <text class="mono panel-title-dim" x="16" y="20">Command</text>
      <text class="mono txt-muted" font-size="12" x="16" y="44">llama-server -m models\Qwen3.5-4B-3D-Coder-Q4_K_M.gguf -c 32768 -ngl 36 -fa on -ctk q8_0 -ctv q8_0 --port 8080 --jinja</text>
    </g>

    <!-- FOOTER: Help Shortcuts Bar -->
    <g transform="translate(0, 516)">
      <text class="mono txt-muted" font-size="11" x="0" y="14">
        <tspan class="txt-accent" font-weight="700">↑↓</tspan> model · 
        <tspan class="txt-accent" font-weight="700">tab</tspan> settings · 
        <tspan class="txt-accent" font-weight="700">enter</tspan> launch · 
        <tspan class="txt-accent" font-weight="700">/</tspan> filter · 
        <tspan class="txt-accent" font-weight="700">o</tspan> path · 
        <tspan class="txt-accent" font-weight="700">p</tspan> presets · 
        <tspan class="txt-accent" font-weight="700">s</tspan> save · 
        <tspan class="txt-accent" font-weight="700">c</tspan> copy · 
        <tspan class="txt-accent" font-weight="700">C</tspan> local · 
        <tspan class="txt-accent" font-weight="700">t</tspan> theme · 
        <tspan class="txt-accent" font-weight="700">?</tspan> help · 
        <tspan class="txt-accent" font-weight="700">q</tspan> quit
      </text>
    </g>

  </g>
</svg>
